# Bolt on your own server: the worker (live bot, holder demo, Bot Cup, Autopilot, copilot).
# HTTPS for api.boltstriker.io comes from the server's shared front door (/srv/edge: one Caddy for every project
# on the box, site file sites/bolt.caddy); the worker joins its "edge" network as bolt-worker.
#   cd /srv/bolt/app && docker compose -f deploy/docker-compose.yml up -d --build
services:
  bolt-worker:
    build:
      context: ..
      dockerfile: worker/Dockerfile
    restart: unless-stopped
    env_file: /srv/bolt/bolt-worker.env # secrets live only on the server (chmod 600), never in git
    environment:
      PORT: "8080"
      DATA_DIR: /data
    volumes:
      - /srv/bolt/data:/data # bot state, Autopilot users (keys encrypted), history: backed up nightly
    expose:
      - "8080"
    networks: [default, edge]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8080/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }

networks:
  edge:
    external: true # created once with `docker network create edge`; the front door lives in /srv/edge
